name: Build and deploy Georgia Disaster Preparedness Map

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for uploaded website archive
        id: source
        shell: bash
        run: |
          if [[ -f georgia-disaster-preparedness-map.zip ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Upload georgia-disaster-preparedness-map.zip to the repository root to enable deployment."
          fi

      - name: Extract website source
        if: steps.source.outputs.available == 'true'
        run: unzip -q georgia-disaster-preparedness-map.zip -d app

      - name: Set up Node.js
        if: steps.source.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and build website
        if: steps.source.outputs.available == 'true'
        working-directory: app
        run: |
          npm ci
          npm run build -- --base=/Georgia-Hazard-Atlas/

      - name: Configure GitHub Pages
        if: steps.source.outputs.available == 'true'
        uses: actions/configure-pages@v5

      - name: Upload built website
        if: steps.source.outputs.available == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - name: Deploy to GitHub Pages
        if: steps.source.outputs.available == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
